name: Build LearnCpp Markdown

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependencias
        run: |
          pip install cloudscraper beautifulsoup4 markdownify

      - name: Descargar y convertir a Markdown
        run: |
          cat << 'EOF' > scraper.py
          import os, time, re, cloudscraper
          from bs4 import BeautifulSoup
          from markdownify import markdownify as md

          scraper = cloudscraper.create_scraper(browser={'browser': 'chrome', 'platform': 'windows', 'desktop': True})
          os.makedirs("learncpp_md", exist_ok=True)

          def limpiar(texto):
              return re.sub(r'[\\/*?:"<>|]', "", texto).strip().replace(" ", "_")

          print("Descargando índice...")
          resp = scraper.get("https://www.learncpp.com/")
          soup = BeautifulSoup(resp.text, "html.parser")
          capitulos = soup.find_all("div", class_="lessontable")

          for idx, cap in enumerate(capitulos):
              header = cap.find("div", class_="lessontable-header")
              titulo_cap = header.get_text(strip=True) if header else f"Capitulo_{idx}"
              enlaces = [a for a in cap.find_all("a", href=True) if "learncpp.com/cpp-tutorial/" in a["href"]]
              if not enlaces:
                  continue

              ruta = os.path.join("learncpp_md", f"{idx:02d}_{limpiar(titulo_cap)[:45]}.md")
              print(f"Procesando {titulo_cap} ({len(enlaces)} lecciones)...")
              
              with open(ruta, "w", encoding="utf-8") as f:
                  f.write(f"# {titulo_cap}\n\n")
                  for a in enlaces:
                      url = a["href"]
                      titulo_lec = a.get_text(strip=True)
                      try:
                          r = scraper.get(url)
                          s = BeautifulSoup(r.text, "html.parser")
                          contenido = s.find("div", class_="entry-content")
                          if contenido:
                              for basura in contenido.find_all("div", class_=["prevnext", "code-block", "cf_monitor"]):
                                  basura.decompose()
                              texto_md = md(str(contenido), heading_style="ATX", code_language="cpp")
                              f.write(f"\n---\n## {titulo_lec}\nFuente: {url}\n\n{texto_md}\n\n")
                          time.sleep(0.5)
                      except Exception as e:
                          print(f"Error en {url}: {e}")
          EOF
          python scraper.py

      - name: Subir archivos Markdown
        uses: actions/upload-artifact@v4
        with:
          name: learncpp-markdown
          path: learncpp_md/
